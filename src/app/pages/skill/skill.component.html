<div class="container mt-5">
  <div class="row">
    <!-- Form Section -->
    <div class="col-md-5 mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-primary">{{ isEditing ? 'Edit Skill' : 'Add Skill' }}</h4>
          <form [formGroup]="skillForm" (ngSubmit)="onSubmit()">
            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="name"
                formControlName="name"
                placeholder="Skill name"
              />
              <label for="name">Skill Name</label>
              <div *ngIf="skillForm.get('name')?.invalid && skillForm.get('name')?.touched">
                <small class="text-danger">Skill name is required</small>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="skillForm.invalid"
              >
                {{ isEditing ? 'Update' : 'Add' }}
              </button>

              <button
                *ngIf="isEditing"
                type="button"
                class="btn btn-secondary"
                (click)="resetForm()"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Skill List Section -->
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-success">Skill List</h4>
          <table class="table table-bordered table-hover mt-3">
            <thead class="table-light">
              <tr>
                <th style="width: 50px;">#</th>
                <th>Skill</th>
                <th style="width: 120px;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let skill of skills; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ skill.name }}</td>
                <td>
                  <button class="btn btn-sm btn-outline-primary me-2" (click)="onEdit(skill)" title="Edit">
                    <i class="fa fa-edit"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="onDelete(skill.id)" title="Delete">
                    <i class="fa fa-trash"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="skills.length === 0">
                <td colspan="3" class="text-center text-muted">No skills added yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
