<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4 text-primary">Upload Your Resume</h3>

    <!-- File Input -->
    <div class="mb-3">
      <label class="form-label fw-bold">Choose Resume File (PDF or DOC/DOCX)</label>
      <input
        type="file"
        (change)="onFileSelected($event)"
        class="form-control"
        accept=".pdf, .doc, .docx"
      />
    </div>

    <!-- Upload Button -->
    <div class="d-grid gap-2">
      <button class="btn btn-primary btn-lg" (click)="onUpload()" [disabled]="uploading">
        {{ uploading ? 'Uploading...' : 'Upload Resume' }}
      </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger mt-3 text-center">
      {{ errorMessage }}
    </div>
  </div>

  <!-- Upload Result Card -->
  <div *ngIf="uploadResult" class="card shadow mt-5 border-success">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">Parsed Resume Details</h5>
    </div>
    <div class="card-body">
      <p><strong>Name: </strong> {{ uploadResult.name }}</p>
      <p><strong>Email: </strong> {{ uploadResult.email }}</p>
      <p><strong>Skills: </strong> {{ uploadResult.skills }}</p>
      <p><strong>ATS Score: </strong>
        <span class="badge bg-primary">{{ uploadResult.ats_score }}%</span>
      </p>
    </div>
  </div>
</div>
