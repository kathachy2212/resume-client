<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <div class="card-body">
      <h3 class="text-center mb-4">Login</h3>
      <form (ngSubmit)="login()">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" name="username" [(ngModel)]="credentials.username" required placeholder="Username">
          <label for="username">Username</label>
        </div>

        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" name="password" [(ngModel)]="credentials.password" required placeholder="Password">
          <label for="password">Password</label>
        </div>

        <button class="btn btn-primary w-100">Login</button>

        <div class="text-danger text-center mt-2" *ngIf="error">{{ error }}</div>
      </form>

      <div class="text-center mt-4">
        <p class="mb-0">New to our platform? <a routerLink="/signup">Sign up</a></p>
      </div>
    </div>
  </div>
</div>
